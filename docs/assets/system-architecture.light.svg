<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" style="font-family:Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>K-Closing Alpha 4-Zone 시스템 아키텍처 토폴로지</title>
  <desc>멀티 브로커 게이트웨이, 15:20 실시간 단면 수집 및 랭커 추론, 15:30 3중 종가 확정 및 주문 실행, 야간 감사 및 백업의 4계층 구조</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" data-paint-static="true"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#F7F7F5" data-fill-role="canvas"/>

  <!-- Header -->
  <g>
    <rect data-fill-role="focus" x="48" y="41" width="6" height="42" rx="3" fill="#2E6DA4"/>
    <text data-fill-role="muted" x="70" y="32" font-size="13.5" font-weight="700" letter-spacing="0.08em" fill="#4A5568" dominant-baseline="central">SYSTEM ARCHITECTURE · 4-ZONE PIPELINE TOPOLOGY</text>
    <text data-fill-role="ink" x="70" y="62" font-size="26" font-weight="700" fill="#252B35" dominant-baseline="central">시점 분리(Point-in-Time) 피처 파이프라인 및 멀티 브로커 퀀트 실행 아키텍처</text>
    <text data-fill-role="ink" x="70" y="94" font-size="14.5" font-weight="600" fill="#252B35" dominant-baseline="central">API 속도 제한 병목과 미래 정보 누출, 중복 주문 위험을 단계별 Fail-Closed 게이트로 차단합니다</text>
  </g>

  <!-- ZONE 01: External Brokers -->
  <g>
    <rect x="48" y="124" width="1104" height="106" rx="14" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule" filter="url(#card-shadow)"/>
    <rect x="64" y="140" width="144" height="74" rx="10" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="136" y="164" font-size="12.5" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">ZONE 01</text>
    <text x="136" y="188" font-size="14.5" font-weight="700" fill="#252B35" data-fill-role="ink" text-anchor="middle" dominant-baseline="central">멀티 브로커 연동</text>

    <!-- 4 Broker Blocks -->
    <g>
      <rect x="224" y="140" width="216" height="74" rx="10" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line"/>
      <text x="240" y="165" font-size="14.5" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">한국투자증권 (KIS)</text>
      <text x="240" y="189" font-size="13" font-weight="600" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">10호가·수급 · 7슬롯 키풀</text>
    </g>
    <g>
      <rect x="452" y="140" width="216" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="468" y="165" font-size="14.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">키움증권 REST</text>
      <text x="468" y="189" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">200행 등락 스캔 · 900틱</text>
    </g>
    <g>
      <rect x="680" y="140" width="216" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="696" y="165" font-size="14.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">DB금융투자 · LS증권</text>
      <text x="696" y="189" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">2,000분봉 · 정규장 500봉</text>
    </g>
    <g>
      <rect x="908" y="140" width="228" height="74" rx="10" fill="#FFFFFF" stroke="#5B54A8" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line"/>
      <text x="924" y="165" font-size="14.5" font-weight="700" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">토스증권 · 호스트 계약</text>
      <text x="924" y="189" font-size="13" font-weight="600" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">200종목 시세 · CAS 토큰락</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M600 230 V256" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" data-stroke-role="focus"/>
  <path d="M594 250 L600 258 L606 250" fill="none" stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="focus"/>

  <!-- ZONE 02: 15:20 Decision & ML -->
  <g>
    <rect x="48" y="264" width="1104" height="106" rx="14" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="64" y="280" width="144" height="74" rx="10" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="136" y="304" font-size="12.5" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">ZONE 02</text>
    <text x="136" y="328" font-size="14.5" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">15:20 단면·추론</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="280" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="305" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">비용인식 유니버스 심사</text>
      <text x="240" y="329" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">2~10% 상승 · 1틱 ≤12.0bp 상한 필터</text>
    </g>
    <g>
      <rect x="532" y="280" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="305" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">무누출 단면 스냅샷 캡처</text>
      <text x="548" y="329" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">SHA-256 원문 보존 · 결정_종가 격리</text>
    </g>
    <g>
      <rect x="840" y="280" width="296" height="74" rx="10" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
      <text x="856" y="305" font-size="15" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">27차원 PIT 피처 &amp; Top-3 추론</text>
      <text x="856" y="329" font-size="13" font-weight="600" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">LightGBM 5-Seed · 번들 패리티 검증</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M600 370 V396" fill="none" stroke="#3F8F72" stroke-width="2.5" stroke-linecap="round" data-stroke-role="positive"/>
  <path d="M594 390 L600 398 L606 390" fill="none" stroke="#3F8F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="positive"/>

  <!-- ZONE 03: Execution & Ledger -->
  <g>
    <rect x="48" y="404" width="1104" height="106" rx="14" fill="#FFFFFF" stroke="#3F8F72" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="64" y="420" width="144" height="74" rx="10" fill="#ECF4F1" stroke="#3F8F72" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="136" y="444" font-size="12.5" font-weight="700" fill="#234F3F" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">ZONE 03</text>
    <text x="136" y="468" font-size="14.5" font-weight="700" fill="#234F3F" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">주문 실행·원장</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="420" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="445" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">Write-Ahead 멱등 주문 저널</text>
      <text x="240" y="469" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">fsync 선기록 · UNKNOWN 폴링 대사</text>
    </g>
    <g>
      <rect x="532" y="420" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="445" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">15:30 3중 종가 확정 게이트</text>
      <text x="548" y="469" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">시각 + 마감코드 '3' + 현재가/호가 일치</text>
    </g>
    <g>
      <rect x="840" y="420" width="296" height="74" rx="10" fill="#ECF4F1" stroke="#3F8F72" stroke-width="1.5" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
      <text x="856" y="445" font-size="15" font-weight="700" fill="#234F3F" data-fill-role="compute-ink" dominant-baseline="central">09:00 시초가 청산 &amp; NAV 보존</text>
      <text x="856" y="469" font-size="13" font-weight="600" fill="#234F3F" data-fill-role="compute-ink" dominant-baseline="central">기계적 전량 매도 · 원 단위 수수료 정산</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M600 510 V536" fill="none" stroke="#5B54A8" stroke-width="2.5" stroke-linecap="round" data-stroke-role="api-line"/>
  <path d="M594 530 L600 538 L606 530" fill="none" stroke="#5B54A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/>

  <!-- ZONE 04: Nightly Ops & Governance -->
  <g>
    <rect x="48" y="544" width="1104" height="106" rx="14" fill="#FFFFFF" stroke="#5B54A8" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line" filter="url(#card-shadow)"/>
    <rect x="64" y="560" width="144" height="74" rx="10" fill="#EFEEF6" stroke="#5B54A8" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="136" y="584" font-size="12.5" font-weight="700" fill="#322E5C" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">ZONE 04</text>
    <text x="136" y="608" font-size="14.5" font-weight="700" fill="#322E5C" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">백필 &amp; 거버넌스</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="560" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="585" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">1분봉 아카이브 &amp; 틱 스윕</text>
      <text x="240" y="609" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">정규·NXT 분봉 적재 · 누락 틱 자가치유</text>
    </g>
    <g>
      <rect x="532" y="560" width="292" height="74" rx="10" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="585" font-size="15" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">주간 재학습 승격 게이트</text>
      <text x="548" y="609" font-size="13" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">순위 상관 ≥0.95 검증 · 오염 모델 차단</text>
    </g>
    <g>
      <rect x="840" y="560" width="296" height="74" rx="10" fill="#EFEEF6" stroke="#5B54A8" stroke-width="1.5" data-fill-role="api-fill" data-stroke-role="api-line"/>
      <text x="856" y="585" font-size="15" font-weight="700" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">tar.zst 세그먼트 봉인 백업</text>
      <text x="856" y="609" font-size="13" font-weight="600" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">SHA-256 매니페스트 · 일요일 복구 드릴</text>
    </g>
  </g>
</svg>

[project]
name = "k-closing-alpha"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "tenacity>=8.5.0",
    "psutil>=6.0.0",
    "tqdm>=4.67.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.9.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "oauth2client>=4.1.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "pykrx>=1.0.0",
    "setuptools>=69.0.0,<82",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.backfill*"]




[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit (Security)
    "PERF", # Perflint (Performance)
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions (Performance/Readability)
    "PT",   # flake8-pytest-style (Testing)
    "SIM",  # flake8-simplify (Readability)
    "TID",  # flake8-tidy-imports
    "ASYNC", # flake8-async
    "T20",  # flake8-print (Ensures no print statements are used, enforcing logger)
    "ARG",  # flake8-unused-arguments (Prevents unused variables/arguments cluttering context)
]
ignore = [
    "S101",   # Allow assert (essential for pytest and invariant checking)
    "E741",   # Allow ambiguous variable names like 'l', 'O', 'I' (often used in math/quant formulas)
    "E501",   # Ignore line length violations (leave it to formatters and prevent AI retry loops)
    "ARG001", # Allow unused function arguments (important for standard signatures / overrides)
    "ARG002", # Allow unused method arguments (important for standard subclasses / interfaces)
    "ARG004", # Allow unused static method arguments
    "ARG005", # Allow unused lambda arguments
    "RUF100", # Allow unused noqa directives (prevents errors when globally ignoring rules like E501)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N803", "N806", "N813", "N814", "ARG", "I001", "RUF059", "F841"]
"scripts/*" = ["T20"]
"tools/agent_skills/lean_check.py" = ["T20", "S607"]
"tools/agent_skills/gen_code_map.py" = ["T20"]
"tools/agent_skills/spec_init.py" = ["T20"]
"tools/agent_skills/sync_task.py" = ["T20", "S607", "S110"]
"tools/devops/clean_logs.py" = ["T20"]
"src/settings.py" = ["N802", "N803"]
"src/config/*.py" = ["N802", "N803"]
"src/api/kis_client.py" = ["T20", "ASYNC230", "ASYNC240", "S110", "SIM108", "B006"]
"src/backfill/*.py" = ["T20", "E402", "N806", "B007", "B905", "S112", "RUF009", "E701", "S110", "RUF059", "RUF015", "B008", "RUF046", "SIM105", "SIM108"]
"src/daily/*.py" = ["T20", "S608", "E402", "N806", "B007", "B905", "S112", "SIM102", "RUF001", "RUF046", "RUF059", "S110", "ASYNC230", "ASYNC240", "E722", "N803", "SIM108"]
"src/sync/*.py" = ["T20", "ASYNC240", "ASYNC251", "N806", "B007", "B905", "B023", "S112"]
"src/processing/*.py" = ["SIM102", "SIM108", "N806", "B905", "C416"]
"src/utils/display.py" = ["T20", "N806", "B023"]
"src/utils/db_to_xlsx.py" = ["T20", "S608"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "^tests/.*/conftest\\.py$",
]

[[tool.mypy.overrides]]
module = ["tests.*", "src.backfill.*", "src.daily.*", "src.sync.*", "src.api.*", "src.data.*", "src.processing.*", "src.utils.*"]
ignore_errors = true




[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]
markers = [
    "slow: tests that read real parquet files (~0.3s each)",
]
filterwarnings = [
    "ignore::RuntimeWarning:numpy.*",
    "ignore::RuntimeWarning:scipy.*",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

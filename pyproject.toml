[project]
name = "stock-trading-system"
version = "0.1.0"
description = "AI Stock Trading System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "optuna>=4.1.0",
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "gplearn>=0.4.3",
    "lightgbm>=4.5.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "pyarrow>=15.0.0",
    "jax[cuda12-pip,cuda13]>=0.10.0; sys_platform != 'win32'",
    "jax>=0.10.0; sys_platform == 'win32'",
    "optax>=0.2.8",
    "ccxt>=4.5.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "TA-Lib>=0.4.32",
    "tenacity>=8.5.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psutil>=6.0.0",
    "tqdm>=4.67.0",
    "joblib>=1.4.0",
    "gspread>=6.0.0",
    "oauth2client>=4.1.3",
    "pykrx>=1.0.40",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "setuptools<70",
]

[project.optional-dependencies]
nsga2 = ["deap>=1.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".tmp_open_trading_api",
    "catboost_info"
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", # PEP8, Pyflakes, Import, Naming
    "B",    # Bugbear
    "S",    # Bandit
    "PERF", # Perflint
    "RUF",  # Ruff-specific
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "TID",  # flake8-tidy-imports
    "ASYNC" # flake8-async
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", # Missing docstrings (AI efficiency)
    "S101",                 # Allow assert
    "D400", "D403", "D415", "D212", "D203", "D213", "D401", "D200", "D205", # Relax Korean docstrings
    "RUF001", "RUF002", "RUF003" # Allow Korean/Unicode characters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "N806"]
"src/etc/**/*.py" = ["E501", "N806", "S608", "E402", "E722", "S112"]
"src/data/**/*.py" = ["E501", "N806", "S608", "E402", "E722"]
"src/utils/**/*.py" = ["E501", "N806", "S608", "B023"]
"src/processing/**/*.py" = ["E501", "N806", "B905"]
"src/daily/**/*.py" = ["E501", "N803", "N806", "E722", "S110", "ASYNC230", "RUF059", "B007", "RUF046", "S608", "ASYNC240", "B905"]
"src/api/**/*.py" = ["E501", "E722", "ASYNC230", "D417", "B006", "ASYNC240", "S110", "D102"]
"src/settings.py" = ["E501"]

[tool.mypy]
# AI에게 엄격한 Type Hinting 강제
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".tmp_open_trading_api",
    "catboost_info"
]

[tool.pyright]
exclude = [
    "data", 
    "legacy", 
    "logs", 
    "results", 
    ".pytest_cache", 
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".tmp_open_trading_api",
    "catboost_info"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "integration: KIS API / 외부 네트워크가 필요한 통합 테스트",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]
